[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eog-fatigue-monitoring"
version = "0.1.0"
description = "EOG-based fatigue-state monitoring research"
requires-python = ">=3.11"

[project.optional-dependencies]
stats = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.13", "scikit-learn>=1.5,<1.8", "factor-analyzer==0.5.1", "pyyaml>=6", "matplotlib>=3.9", "pytest>=8"]
raw = ["pyedflib>=0.1.30"]
cfa = ["semopy==2.3.11"]
report = ["python-docx>=1.1"]
deep = ["torch>=2.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
